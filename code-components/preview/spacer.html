<!doctype html>

      h1 { padding: 1rem 2.5rem 0; }

        --_sizing-spacer-gap---spacer--xsmall: 2rem;
        --_sizing-spacer-gap---spacer--small: 3rem;
        --_sizing-spacer-gap---spacer--medium: 5rem;
        --_sizing-spacer-gap---spacer--large: 8rem;
        --_sizing-spacer-gap---spacer--xlarge: 12rem;
        --_sizing-spacer-gap---spacer--custom-1: 5rem;
        --_sizing-spacer-gap---spacer--custom-2: 12rem;
        --_sizing-spacer-gap---spacer--custom-3: 90rem;
      }

  </head>
  <body>
    <div id="root"></div>
